name: Обновить цены и скидки

on:
  schedule:
    - cron: '15 4 * * *'   # каждый день в 05:15 по Праге (зимой)
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать скидки с kupi.cz
        run: python scripts/update_prices.py
      - name: Сохранить prices.json
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Обновление цен $(date +'%Y-%m-%d')"
          git push

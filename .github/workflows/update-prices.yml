name: Обновить цены и скидки

# kupi.cz блокирует серверы GitHub (403), поэтому цены обновляются с домашнего компьютера
# (scripts/update_and_push.ps1). Здесь остаётся только ручной запуск — на случай, если блок снимут.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать скидки с kupi.cz
        run: python scripts/update_prices.py
      - name: Сохранить prices.json
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Обновление цен $(date +'%Y-%m-%d')"
          git push
